.key{flex:none;width:36px;height:36px}
.col{flex:1;min-width:0}
p{margin:0 0 12px;line-height:1.35}
h1{margin:0 0 8px;font-size:1.05rem}
label.f{display:block;margin-bottom:4px}
input[type=password]{width:100%;height:28px;font:inherit;padding:2px 6px;background:#fff;color:#000;border:2px solid;border-color:#808080 #fff #fff #808080;box-shadow:inset 1px 1px #0a0a0a;outline:none}
.keep{display:flex;gap:8px;align-items:center;margin:12px 0 14px;cursor:pointer}
button{height:28px;min-width:90px;padding:0 14px;font:inherit;color:#000;background:#c0c0c0;border:2px solid;border-color:#fff #0a0a0a #0a0a0a #fff;box-shadow:inset -1px -1px #808080,inset 1px 1px #dfdfdf;cursor:pointer}
button:active{border-color:#0a0a0a #fff #fff #0a0a0a;box-shadow:inset 1px 1px #808080}
button:focus-visible{outline:1px dotted #000;outline-offset:-5px}
button:disabled{color:#808080;cursor:wait}
#msg{margin:12px 0 0;min-height:1.4em;color:#a00000;font-weight:700}
</style>

const KEYSTORE='econ308-unlock-key';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const te=new TextEncoder();
async function deriveKey(pw){
  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function openWith(key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
  const html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  document.open();document.write(html);document.close();
}
(async()=>{
  try{
    const saved=localStorage.getItem(KEYSTORE);
    if(saved){const key=await crypto.subtle.importKey('raw',b64(saved),'AES-GCM',false,['decrypt']);await openWith(key)}
  }catch(e){try{localStorage.removeItem(KEYSTORE)}catch(_){}}
})();
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const msg=document.getElementById('msg'),btn=document.getElementById('go');
  msg.textContent='';btn.disabled=true;btn.textContent='Please wait...';
  try{
    if(!window.crypto||!crypto.subtle)throw new Error('nocrypto');
    const key=await deriveKey(document.getElementById('pw').value);
    if(document.getElementById('keep').checked){
      try{const raw=await crypto.subtle.exportKey('raw',key);localStorage.setItem(KEYSTORE,btoa(String.fromCharCode(...new Uint8Array(raw))))}catch(_){}
    }
    await openWith(key);
  }catch(e){
    try{localStorage.removeItem(KEYSTORE)}catch(_){}
    msg.textContent=e.message==='nocrypto'?'This browser cannot unlock the page over an insecure connection. Use the https address.':'The password you typed is incorrect.';
    btn.disabled=false;btn.textContent='OK';
  }
});
})();
