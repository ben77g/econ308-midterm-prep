<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ECON 308 midterm prep</title>
<meta name="theme-color" content="#E7E7E4">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@400;700;900&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E7E7E4;--surface:#F7F7F5;--surface-2:#EEEEEB;--ink:#0B0B0B;--on-ink:#F7F7F5;--muted:#62625E;--line:#D2D2CD;--dotc:#C9C9C3;--red:#D71921}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px;background-color:var(--bg);background-image:radial-gradient(circle,var(--dotc) 1px,transparent 1.4px);background-size:18px 18px;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif}
main{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:32px;padding:32px 28px 28px}
.eyebrow{margin:0 0 14px;display:flex;align-items:center;gap:9px;font-family:"Space Mono",ui-monospace,monospace;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.led{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 22%,transparent),0 0 10px var(--red)}
h1{margin:0 0 10px;font-family:"Doto","Space Mono",monospace;font-weight:900;font-size:clamp(2.2rem,12vw,3rem);line-height:.95;text-transform:uppercase}
p.sub{margin:0 0 26px;color:var(--muted);font-size:.95rem}
label.f{display:block;margin-bottom:8px;font-family:"Space Mono",ui-monospace,monospace;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input[type=password]{width:100%;min-height:50px;font:inherit;font-size:1rem;padding:0 20px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);color:var(--ink)}
input[type=password]:focus{outline:none;border-color:var(--ink)}
.keep{display:flex;gap:10px;align-items:center;color:var(--muted);margin:16px 4px 20px;font-size:.9rem;cursor:pointer}
button{width:100%;min-height:50px;font-family:"Space Mono",ui-monospace,monospace;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;border:0;border-radius:999px;background:var(--ink);color:var(--on-ink);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{margin:14px 0 0;min-height:1.4em;color:var(--red);font-family:"Space Mono",ui-monospace,monospace;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}
</style>
</head>
<body>
<main>
  <p class="eyebrow"><i class="led"></i>ECON 308 / Locked</p>
  <h1>Midterm prep</h1>
  <p class="sub">Enter the password to open the study guide.</p>
  <form id="f" autocomplete="on">
    <label class="f" for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <label class="keep"><input type="checkbox" id="keep" checked> Keep me unlocked on this device</label>
    <button id="go" type="submit">Unlock</button>
    <p id="msg" role="alert"></p>
  </form>
</main>

const KEYSTORE='econ308-unlock-key';
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const te=new TextEncoder();
async function deriveKey(pw){
  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function openWith(key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
  const html=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
  document.open();document.write(html);document.close();
}
(async()=>{
  try{
    const saved=localStorage.getItem(KEYSTORE);
    if(saved){const key=await crypto.subtle.importKey('raw',b64(saved),'AES-GCM',false,['decrypt']);await openWith(key)}
  }catch(e){try{localStorage.removeItem(KEYSTORE)}catch(_){}}
})();
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const msg=document.getElementById('msg'),btn=document.getElementById('go');
  msg.textContent='';btn.disabled=true;btn.textContent='Unlocking…';
  try{
    if(!window.crypto||!crypto.subtle)throw new Error('nocrypto');
    const key=await deriveKey(document.getElementById('pw').value);
    if(document.getElementById('keep').checked){
      try{const raw=await crypto.subtle.exportKey('raw',key);localStorage.setItem(KEYSTORE,btoa(String.fromCharCode(...new Uint8Array(raw))))}catch(_){}
    }
    await openWith(key);
  }catch(e){
    try{localStorage.removeItem(KEYSTORE)}catch(_){}
    msg.textContent=e.message==='nocrypto'?'This browser cannot unlock the page over an insecure connection. Use the https address.':'Wrong password.';
    btn.disabled=false;btn.textContent='Unlock';
  }
});
})();
